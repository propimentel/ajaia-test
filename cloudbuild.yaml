# Cloud Build config for the combined backend + frontend image.
# Used by `gcloud builds submit --config=cloudbuild.yaml .` in the
# GitHub Actions deploy job. The Dockerfile lives in apps/backend/ and
# builds both apps, so we point the docker step at it explicitly.
#
# Note: Cloud Build does NOT recursively expand predefined substitutions
# (like ${PROJECT_ID} / ${SHORT_SHA}) when they appear inside a
# user-defined substitution (${_VAR}). Keep predefined vars inline.

steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/ajaia-images/ajaia-app:${SHORT_SHA}
      - --file=apps/backend/Dockerfile
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ajaia-images/ajaia-app:${SHORT_SHA}

substitutions:
  _REGION: us-east1

options:
  logging: CLOUD_LOGGING_ONLY
