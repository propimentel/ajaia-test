name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: us-east1
  SERVICE_APP: ajaia-app
  RUNTIME_SA: ajaia-ci@ajaia-test.iam.gserviceaccount.com

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Build
        run: pnpm turbo build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build app image (backend + frontend in one container)
        run: |
          gcloud builds submit \
            --tag "${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY }}/${{ env.SERVICE_APP }}:${{ github.sha }}" \
            --file apps/backend/Dockerfile \
            .

      - name: Run Prisma migrations against the live database
        run: |
          export DATABASE_URL=$(gcloud secrets versions access latest --secret=ajaia-supabase-db-url)
          pnpm --filter @ajaia/shared build
          pnpm --filter @ajaia/backend exec prisma migrate deploy

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_APP }} \
            --region=${{ env.GCP_REGION }} \
            --image="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY }}/${{ env.SERVICE_APP }}:${{ github.sha }}" \
            --set-secrets=DATABASE_URL=ajaia-supabase-db-url:latest \
            --allow-unauthenticated \
            --service-account=${{ env.RUNTIME_SA }} \
            --port=8080 \
            --max-instances=1 \
            --quiet

      - name: Capture app URL
        id: app
        run: |
          APP_URL=$(gcloud run services describe ${{ env.SERVICE_APP }} --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $APP_URL"

      - name: Clean up legacy services (ajaia-backend, ajaia-frontend)
        if: always()
        run: |
          for service in ajaia-backend ajaia-frontend; do
            if gcloud run services describe "$service" --region=${{ env.GCP_REGION }} >/dev/null 2>&1; then
              echo "Deleting legacy service: $service"
              gcloud run services delete "$service" --region=${{ env.GCP_REGION }} --quiet
            else
              echo "Legacy service not present, skipping: $service"
            fi
          done
